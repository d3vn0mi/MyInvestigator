[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pni"
version = "0.1.0"
description = "Phone Number Investigator — OSINT toolkit for phone, email, and name reconnaissance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "d3vn0mi"}]
keywords = ["osint", "phone", "email", "recon", "investigation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1",
    "aiohttp>=3.9",
    "phonenumbers>=8.13",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "flake8>=7.0",
    "pre-commit>=3.6",
]

[project.scripts]
pni = "pni.cli:cli"

[tool.setuptools.packages.find]
include = ["pni*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
